#
# The test IdP's admin API, from inside the cluster (#27): the master realm and
# the admin API are not on the internet (test-idp/keycloak.yaml), and the
# cluster refuses port-forward to a deploy account. test-idp/signin.sh runs
# this Job, with Keycloak's own kcadm.sh, the same image, for one action:
#
#   ACTION=remove  REALM USERNAME   deletes the user at the IdP
#   ACTION=restore REALM            puts back the realm's users that are missing,
#                                   from keycloak-realms (partial import, the
#                                   existing ones skipped)
#
# The admin's password comes from the Secret keycloak-admin into kcadm.sh's
# environment (KC_CLI_PASSWORD), never onto a command line or into the log.
apiVersion: batch/v1
kind: Job
metadata:
  name: test-idp-admin
  namespace: tac-test-idp
  labels:
    app.kubernetes.io/part-of: test-idp
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: test-idp-admin
        app.kubernetes.io/part-of: test-idp
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: kcadm
          image: quay.io/keycloak/keycloak:26.8.1-2@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              kc() { /opt/keycloak/bin/kcadm.sh "$@" --config /tmp/kcadm/config; }
              kc config credentials --server http://keycloak-admin:8080 --realm master --user "$KC_CLI_USER" >/dev/null
              case $ACTION in
                remove)
                  ids=$(kc get users -r "$REALM" -q exact=true -q "username=$USERNAME" --fields id --format csv --noquotes)
                  for id in $ids; do kc delete "users/$id" -r "$REALM"; done
                  if [ -n "$ids" ]; then echo "$REALM: $USERNAME removed at the IdP"; else echo "$REALM: $USERNAME was not there"; fi ;;
                restore)
                  kc create partialImport -r "$REALM" -s ifResourceExists=SKIP -o -f "/realms/$REALM.json" > /tmp/kcadm/import
                  echo "$REALM: $(grep -o '"added" *: *[0-9]*' /tmp/kcadm/import | grep -o '[0-9]*$' || echo 0) added back" ;;
                *) echo "ACTION is [$ACTION], not remove or restore" >&2; exit 2 ;;
              esac
          env:
            - { name: ACTION, value: "" }
            - { name: REALM, value: "" }
            - { name: USERNAME, value: "" }
            - name: KC_CLI_USER
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_CLI_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: kcadm, mountPath: /tmp/kcadm }
            - { name: realms, mountPath: /realms, readOnly: true }
      volumes:
        - { name: kcadm, emptyDir: { sizeLimit: 16Mi } }
        - { name: realms, secret: { secretName: keycloak-realms } }
