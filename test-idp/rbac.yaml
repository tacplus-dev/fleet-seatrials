#
# The test IdP's namespace and what the pipeline's test-idp jobs may do on the
# `dev` cluster, as the GCP service account test-idp-deploy (through
# Workload Identity Federation, docs/deploy-pipeline.md): the objects of
# test-idp/keycloak.yaml in the namespace test-idp, and nothing in any other
# namespace. The hub applies this file once, as cluster-admin; the jobs cannot
# change it.
apiVersion: v1
kind: Namespace
metadata:
  name: test-idp
  labels:
    app.kubernetes.io/part-of: test-idp
---
# The namespace itself, by name only: the job applies its labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-idp-namespace
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [test-idp]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-idp-namespace
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: test-idp-namespace }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: test-idp-deploy@tacplus-dev.iam.gserviceaccount.com }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-idp-deploy
  namespace: test-idp
rules:
  - apiGroups: ["", apps]
    resources: [statefulsets, services, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  # apply.sh reaches the admin API through a port-forward, never the internet.
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.gke.io]
    resources: [managedcertificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cloud.google.com]
    resources: [backendconfigs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-idp-deploy
  namespace: test-idp
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: test-idp-deploy }
subjects:
  - { apiGroup: rbac.authorization.k8s.io, kind: User, name: test-idp-deploy@tacplus-dev.iam.gserviceaccount.com }
