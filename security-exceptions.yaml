  - id: CVE-2026-95839
    reason: "containerd v2.4.1 linked into docker-buildx (usr/local/libexec/docker/cli-plugins/docker-buildx) of the CI image ghcr.io/tacplus-dev/tacplus/build:2.6.12 only (build.lock, #60): the image only runs CI jobs and is never deployed, and no job runs buildx against an untrusted registry or image; the vulnerable code is containerd's descriptor handling, a daemon crash, and no containerd daemon runs in it. Fixed in containerd 2.4.2 (buildx 0.39.1); no tacplus 2.6 build image has it yet (v2.6.13, the latest, has v2.4.1): the fix is the tacplus 2.6 patch that moves buildx, then move the CI image to it by tag and digest and remove this entry."
    decided_by: "jodydadescott (hub 16:30Z, tacplus-dev/fleet-seatrials#60, 2026-11-20)"
    expires: 2026-12-04
  - id: CVE-2026-97054
    reason: "Go stdlib 1.26.10 in the docker CLI (usr/local/bin/docker) of the CI image ghcr.io/tacplus-dev/tacplus/build:2.6.12 only (build.lock, #60): the image only runs CI jobs and is never deployed, and the vulnerable code is net/http's HTTP/1 server (MaxBytesReader), which the docker CLI never serves. Fixed in Go 1.26.11; tacplus copies the CLI from docker:29-cli, built with 1.26.10 (tacplus-dev/tacplus#901), and no tacplus 2.6 build image has the fix yet (v2.6.13, the latest, has 1.26.10): the fix is the tacplus 2.6 patch that closes #901, then move the CI image to it by tag and digest and remove this entry."
    decided_by: "jodydadescott (hub 16:30Z, tacplus-dev/fleet-seatrials#60, 2026-11-20)"
    expires: 2026-12-04
  - id: CVE-2026-102554
    reason: "Guava 33.6.0-jre in the test IdP's Keycloak 26.8.1-2 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. A denial of service by unthrottled allocation in deserialization: at worst the test IdP restarts. Fixed in Guava 33.7.2; no Keycloak release has it yet (26.8.2-0, the latest, has 33.6.0-jre): the fix is the first Keycloak release with Guava 33.7.2 or later, then move the pin to it by tag and digest."
    decided_by: "jodydadescott (tacplus-dev/fleet-seatrials#41, 2026-11-06)"
    expires: 2026-12-06
  - id: CVE-2026-119373
    reason: "sqlite-libs 3.34.1-11.el9_8 (Red Hat 9.8) in the test IdP's Keycloak 26.8.1-2 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. Keycloak's database is H2 (KC_DB dev-file); nothing in the image opens an SQLite file from outside. Red Hat has no fix yet, and no Keycloak release has one (26.8.2-0, the latest, has the same package): the fix is the first Keycloak release rebuilt on a fixed sqlite-libs, then move the pin to it by tag and digest. The same id is in the CI image's libsqlite3 (build:2.6.12, Debian 13.7), with no Debian fix: it would not fail the job without this entry, which marks it accepted too."
    decided_by: "jodydadescott (tacplus-dev/fleet-seatrials#41, 2026-11-06)"
    expires: 2026-12-06
