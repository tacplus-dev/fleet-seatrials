#
# The known findings this repository accepts, each until its expiry, in the form looper-scan reads
# (tacplus-dev/looper#49: exactly id, reason, decided_by and expires, YYYY-MM-DD). ci/security.sh enforces it
# (#36): an entry that has expired fails the security job, so does one with any other field. Each was found by the
# job's first run, 2026-11-04, with no fix this repository can take: `govulncheck -mode=binary` in the pinned tool
# binaries (ci/tools.sh), each at its latest release or pin. Each expires after 30 days; by then move the pin past
# the fix and remove its entry, or decide again (PROPOSALS.md). By binary:
#
#   schematic-operator (#11)    GO-2025-3528 3829 3887 3888 4100 4108, GO-2026-4762 4918 4958 5026 5475 5506 5758
#                               5932 6061 6348 6443 6444 6597 6603 6610 6611 6612 6617 6796
#
# Trivy's, gitleaks', OSV-Scanner's and opa's (GO-2026-6860 6866, GO-2025-3922, GO-2026-6865 6888) are fixed: ci/tools.sh
# builds them from source with the fixed dependencies (#40). So is lego 5.6.0's GO-2026-5932 (found 2026-11-05, when
# the cert job pinned it): ci/tools.sh builds it with x/crypto v0.59.0, which no lego release requires yet (#52). build:2.3's ImageMagick and apt CVEs (#40) are fixed:
# the CI image is ghcr.io/tacplus-dev/tacplus/build:2.6.12 by digest (#43, #45, #50), with ImageMagick deb13u14, apt 3.0.4,
# zlib1g deb13u1 (CVE-2026-85091 76844), a gh on x/net v0.62.0 (CVE-2026-78661), OpenEXR 3.2.12-1~deb13u1
# (CVE-2026-42216 42217 and 14 HIGH) and ASP.NET Core 10.0.15 (CVE-2026-114146 114147 114149). Trivy's scan of it still finds
# gh's and docker-buildx's x/crypto v0.58.0; when a line image moves them, move the CI image (every image: of
# ci/*.gitlab-ci.yml, .github/workflows/security.yml and images/tacplus-build.Dockerfile's BUILD_IMAGE) to it and
# remove them from GO-2026-5932, above. Two more in it, found by the nightly of 2026-11-20 (#60), have no tacplus 2.6
# release that fixes them (v2.6.13, the latest, has both), and are accepted for 14 days, until 2026-12-04 (Jody, #60):
#
#   docker-buildx's containerd v2.4.1 (fixed in 2.4.2; buildx 0.39.1)    CVE-2026-95839
#   the docker CLI's Go stdlib 1.26.10 (fixed in 1.26.11; tacplus#901)   CVE-2026-97054
#
# When a tacplus 2.6 patch's build image carries the fixes, move the CI image to it by tag and digest (build.lock and
# the places above; ci/build_lock_test.sh) and remove these two.
#
# And Trivy's scan of the images this repository deploys itself (#41): the test IdP's Keycloak, 26.8.1-2
# (test-idp/keycloak.yaml), for arm64. No Keycloak release fixes them yet: 26.8.2-0 (2026-11-05), the latest, has the
# same four. Accepted until 2026-12-06 (Jody, #41); when a Keycloak release ships the fixes, move
# test-idp/keycloak.yaml to it by tag and digest, run test-idp/local.sh, and remove these:
#
#   Guava 33.6.0-jre (fixed in 33.7.2)                              CVE-2026-102554
#   sqlite-libs 3.34.1-11.el9_8 (Red Hat 9.8, no fix yet)           CVE-2026-119373 119586
#   java-21-openjdk-headless 1:21.0.13.0.9-1.2.el9 (no fix yet)     CVE-2026-91403
#
# And one Trivy config check, rule-wide (Jody, the hub's triage rules, #57): DS-0026, no HEALTHCHECK in a
# Dockerfile. Reviewed every six months, not fixed: Kubernetes ignores Docker's HEALTHCHECK. The other Trivy config
# findings below HIGH on #57 (DS-0013, KSV-0011, KSV-0020, KSV-0021, KSV-0125) stay on the nightly report, with no
# exception, by the same decision.
