  - id: CVE-2026-109518
    reason: "apt 3.0.3 in the CI image (ghcr.io/tacplus-dev/tacplus/build:2.3, Debian 13.7): an on-path attack on package installs. No job runs apt on the runner (ci/tools.sh fetches each tool by its pinned SHA-256 or module hash); it runs only in the images job's Cloud Build of images/tacplus-build.Dockerfile, which installs the cross compilers from Debian's signed archive inside Google's network. Fixed in apt 3.0.4; arrives with the line's image rebuild (tacplus-dev/tacplus#283)."
    decided_by: "jodydadescott (hub, tacplus-dev/fleet-seatrials#40, 2026-11-06; as tacplus-dev/cluster#8)"
