    reason: "java-21-openjdk-headless 1:21.0.13.0.9-1.2.el9 (Red Hat 9.8), the JDK Keycloak runs on, in the test IdP's Keycloak 26.8.1-2 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. Red Hat has no fix yet, and no Keycloak release has one (26.8.2-0, the latest, has the same JDK): the fix is the first Keycloak release rebuilt on a fixed OpenJDK 21, then move the pin to it by tag and digest."
