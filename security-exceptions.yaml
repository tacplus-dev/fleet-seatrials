# The known findings this repository accepts, each until its expiry, in the form looper-scan reads
# (tacplus-dev/looper#49: exactly id, reason, decided_by and expires, YYYY-MM-DD). ci/security.sh enforces it
# (#36): an entry that has expired fails the security job, so does one with any other field. Each was found by the
# job's first run, 2026-11-04, with no fix this repository can take: `govulncheck -mode=binary` in the pinned tool
# binaries (ci/tools.sh), each at its latest release or pin. Each expires after 30 days; by then move the pin past
# the fix and remove its entry, or decide again (PROPOSALS.md). The operator pin's 25 (#11) went with #1's move to
# operator v0.1.0 (a17d507, past operator#9 and #10): govulncheck finds none of them in schematic-operator any more
# (main's security run of 4730899, 2026-11-23), GO-2026-5932 included, which stays for the CI image alone.
#
# Trivy's, gitleaks', OSV-Scanner's and opa's (GO-2026-6860 6866, GO-2025-3922, GO-2026-6865 6888) are fixed: ci/tools.sh
# builds them from source with the fixed dependencies (#40). So is lego 5.6.0's GO-2026-5932 (found 2026-11-05, when
# the cert job pinned it): ci/tools.sh builds it with x/crypto v0.59.0, which no lego release requires yet (#52). build:2.3's ImageMagick and apt CVEs (#40) are fixed:
# the CI image is ghcr.io/tacplus-dev/tacplus/build:20261123-ef62327 by digest (#64; build:2.6.12 from #43, #45, #50
# until then), tacplus's 2.6 build image rebuilt on Debian 13.8 (tacplus Images run 45102777942), with ImageMagick
# deb13u14, apt 3.0.4, zlib1g deb13u1 (CVE-2026-85091 76844), a gh on x/net v0.62.0 (CVE-2026-78661), OpenEXR
# 3.2.12-1~deb13u1 (CVE-2026-42216 42217 and 14 HIGH), ASP.NET Core 10.0.15 (CVE-2026-114146 114147 114149), krb5
# 1.21.3-5+deb13u2 and a current linux-libc-dev (#64: the 33 HIGH of 2026-11-23), docker-buildx's containerd v2.4.2
# (CVE-2026-95839) and a docker CLI on Go 1.27.4 (CVE-2026-97054; both accepted from #60 until #64). Trivy's scan of
# it still finds gh's and docker-buildx's x/crypto v0.58.0; when a line image moves them, move the CI image (build.lock,
# every image: of ci/*.gitlab-ci.yml, .github/workflows/security.yml and images/tacplus-build.Dockerfile's
# BUILD_IMAGE; ci/build_lock_test.sh, ci/workflows_test.sh) to it and remove them from GO-2026-5932, below.
#
# And Trivy's scan of the images this repository deploys itself (#41): the test IdP's Keycloak, 26.8.2-3
# (test-idp/keycloak.yaml, 2026-11-19, the latest; #59 moved it from 26.8.1-2 for its JDK's CVE-2026-114938 to 114942),
# for arm64. No Keycloak release fixes these four yet: 26.8.2-3 has them all. Accepted until 2026-12-06 (Jody, #41);
# when a Keycloak release ships the fixes, move test-idp/keycloak.yaml and test-idp/admin-job.yaml to it by tag and
# digest, run test-idp/local.sh, and remove these:
#
#   Guava 33.6.0-jre (fixed in 33.7.2)                              CVE-2026-102554
#   sqlite-libs 3.34.1-11.el9_8 (Red Hat 9.8, no fix yet)           CVE-2026-119373 119586
#   java-21-openjdk-headless 1:21.0.13.1.2-1.2.el9 (no fix yet)     CVE-2026-91403
#
# And one Trivy config check, rule-wide (Jody, the hub's triage rules, #57): DS-0026, no HEALTHCHECK in a
# Dockerfile. Reviewed every six months, not fixed: Kubernetes ignores Docker's HEALTHCHECK. The other Trivy config
# findings below HIGH on #57 (DS-0013, KSV-0011, KSV-0020, KSV-0021, KSV-0125) stay on the nightly report, with no
# exception, by the same decision.
exceptions:
  - id: GO-2026-5932
    reason: "x/crypto/openpgp in gh and docker-buildx in the CI image (build:20261123-ef62327, Trivy's scan): neither handles an OpenPGP key or message from outside (no job runs gh or buildx). The fix is x/crypto v0.59.0; no rebuilt CI image carries it yet. schematic-operator no longer reaches it (operator v0.1.0, #11)."
    decided_by: "looper, at Jody's direction in #36: fix what has a fix, accept the rest for 30 days (2026-11-04)"
    expires: 2026-12-04
  - id: CVE-2026-102554
    reason: "Guava 33.6.0-jre in the test IdP's Keycloak 26.8.2-3 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. A denial of service by unthrottled allocation in deserialization: at worst the test IdP restarts. Fixed in Guava 33.7.2; no Keycloak release has it yet (26.8.2-3, the latest, has 33.6.0-jre): the fix is the first Keycloak release with Guava 33.7.2 or later, then move the pin to it by tag and digest."
    decided_by: "jodydadescott (tacplus-dev/fleet-seatrials#41, 2026-11-06)"
    expires: 2026-12-06
  - id: CVE-2026-119373
    reason: "sqlite-libs 3.34.1-11.el9_8 (Red Hat 9.8) in the test IdP's Keycloak 26.8.2-3 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. Keycloak's database is H2 (KC_DB dev-file); nothing in the image opens an SQLite file from outside. Red Hat has no fix yet, and no Keycloak release has one (26.8.2-3, the latest, has the same package): the fix is the first Keycloak release rebuilt on a fixed sqlite-libs, then move the pin to it by tag and digest. The same id is in the CI image's libsqlite3 (build:20261123-ef62327, Debian 13.8), with no Debian fix: it would not fail the job without this entry, which marks it accepted too."
    decided_by: "jodydadescott (tacplus-dev/fleet-seatrials#41, 2026-11-06)"
    expires: 2026-12-06
  - id: CVE-2026-119586
    reason: "sqlite-libs 3.34.1-11.el9_8 (Red Hat 9.8) in the test IdP's Keycloak 26.8.2-3 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. Keycloak's database is H2 (KC_DB dev-file); nothing in the image opens an SQLite file from outside. Red Hat has no fix yet, and no Keycloak release has one (26.8.2-3, the latest, has the same package): the fix is the first Keycloak release rebuilt on a fixed sqlite-libs, then move the pin to it by tag and digest."
    decided_by: "jodydadescott (tacplus-dev/fleet-seatrials#41, 2026-11-06)"
    expires: 2026-12-06
  - id: CVE-2026-91403
    reason: "java-21-openjdk-headless 1:21.0.13.1.2-1.2.el9 (Red Hat 9.8), the JDK Keycloak runs on, in the test IdP's Keycloak 26.8.2-3 (test-idp/keycloak.yaml, #27): one replica in the namespace test-idp, with test realms, test users and test data only, and not deployed yet (STATE.md); it forwards only the three test realms and their login pages to the internet. Red Hat has no fix yet, and no Keycloak release has one (26.8.2-3, the latest, has the same JDK): the fix is the first Keycloak release rebuilt on a fixed OpenJDK 21, then move the pin to it by tag and digest."
    decided_by: "jodydadescott (tacplus-dev/fleet-seatrials#41, 2026-11-06)"
    expires: 2026-12-06
  - id: DS-0026
    reason: "Trivy's no-HEALTHCHECK check, for every Dockerfile in this repository (today images/tacplus-build.Dockerfile, the image the service builds run in on Cloud Build, #57): Kubernetes ignores Docker's HEALTHCHECK, and what this repository runs on a cluster is checked by its liveness and readiness probes (the operator's for the fleet, test-idp/keycloak.yaml's for the test IdP); a build step's image needs none. Every FROM is pinned by digest (images/build_test.sh). Non-blocking (LOW): no gate is bypassed."
    decided_by: "jodydadescott (hub), the triage rules' rule-wide DS-0026 exception (tacplus-dev/fleet-seatrials#57, 2026-11-18)"
    expires: 2027-05-17
