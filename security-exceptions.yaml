# The known findings this repository accepts, each until its expiry, in the form looper-scan reads
# (tacplus-dev/looper#49: exactly id, reason, decided_by and expires, YYYY-MM-DD). ci/security.sh enforces it
# (#36): an entry that has expired fails the security job, so does one with any other field. Each was found by the
# job's first run, 2026-11-04, with no fix this repository can take: `govulncheck -mode=binary` in the pinned tool
# binaries (ci/tools.sh), each at its latest release or pin. Each expires after 30 days; by then move the pin past
# the fix and remove its entry, or decide again (PROPOSALS.md). By binary:
#
#   schematic-operator (#11)    GO-2025-3528 3829 3887 3888 4100 4108, GO-2026-4762 4918 4958 5026 5475 5506 5758
#                               5932 6061 6348 6443 6444 6597 6603 6610 6611 6612 6617 6796
#   lego 5.6.0 (#35)            GO-2026-5932 (found 2026-11-05, when the cert job pinned it; its latest release)
#
# Trivy's, gitleaks', OSV-Scanner's and opa's (GO-2026-6860 6866, GO-2025-3922, GO-2026-6865 6888) are fixed: ci/tools.sh
# builds them from source with the fixed dependencies (#40). And Trivy's scan of the CI image,
# ghcr.io/tacplus-dev/tacplus/build:2.3 (Debian 13.7; #40): Debian fixed them, the image is not rebuilt yet. Accepted
# until 2026-11-19, as tacplus-dev/cluster#8; when tacplus-dev/tacplus#283 rebuilds the line's images, move the CI
# image (every image: of ci/*.gitlab-ci.yml, .github/workflows/security.yml) to the rebuilt one and remove these:
#
#   ImageMagick 8:7.1.1.43+dfsg1-1+deb13u13 (fixed in deb13u14)   CVE-2026-109258 109260 109262 109263 109268 116149
#   apt 3.0.3 (fixed in 3.0.4)                                      CVE-2026-109518
#   gh and docker-buildx (x/crypto v0.58.0)                         GO-2026-5932, above
