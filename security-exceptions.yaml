  - id: DS-0026
    reason: "Trivy's no-HEALTHCHECK check, for every Dockerfile in this repository (today images/tacplus-build.Dockerfile, the image the service builds run in on Cloud Build, #57): Kubernetes ignores Docker's HEALTHCHECK, and what this repository runs on a cluster is checked by its liveness and readiness probes (the operator's for the fleet, test-idp/keycloak.yaml's for the test IdP); a build step's image needs none. Every FROM is pinned by digest (images/build_test.sh). Non-blocking (LOW): no gate is bypassed."
    decided_by: "jodydadescott (hub), the triage rules' rule-wide DS-0026 exception (tacplus-dev/fleet-seatrials#57, 2026-11-18)"
    expires: 2027-05-17
