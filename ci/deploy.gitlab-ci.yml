#
# The seatrials deploy and test pipeline (#17; tacplus-dev/roadmap
# decisions/ci-on-gitlab-2026-10-27.md, addendum 2026-10-29). It runs in the
# private GitLab project gitlab.com/tacplus-dev/fleet-seatrials as the child
# pipeline of that project's own .gitlab-ci.yml (ci/gitlab-project.gitlab-ci.yml
# here), which resolves the commit to deploy, FLEET_COMMIT, and includes this
# file from it. Every job checks this repository out at FLEET_COMMIT. Runbook,
# variables and the GCP side: docs/deploy-pipeline.md.
#
#   tools     tacplus, schematic-operator, yq and opa, built from pinned sources
#   checks    the repository's script tests (the letsencrypt guard among them)
#   images    images/build.sh changed on Cloud Build, waiting for every build
#   generate  schematic-operator generate with the fleet's key material; the routing policy checked
#   diff      what an apply would change, by object name; fails if it touches letsencrypt;
#             records the render's digest
#   apply     once diff succeeds, by itself (seatrials is not production), the render diff
#             showed, by digest; protected environment seatrials
#   test      the functional end-to-end suite (deploy/e2e.yaml), its report as the job's JUnit report
#
# Manual, because none of them is approval of the fleet: apply-letsencrypt (Jody's standing
# never-restart-letsencrypt rule; only Jody plays it), signin-secrets (a rotated secret),
# test-idp (the test IdP's one-time setup).
#
# and the test IdP (#27, test-idp/README.md), on the `tacplus` cluster:
#
#   test-idp         manual, protected environment test-idp: Keycloak, its realms, its DNS record
#   test-idp-signin  every realm's discovery and claim shapes; one user per realm signs in
#                    at tacplus.dev and gets a kernel session; the removed user is refused
#
# The fleet's key material and the sign-in secrets come from protected project
# variables (never group variables: those reach the loopers' agents), GCP
# through GitLab OIDC and Workload Identity Federation (no key file), this
# repository through the keyless tacplus-reader GitHub App (.github-reader: no
# stored GitHub token). Nothing
# secret is written to the repository, an artifact or a job log: no job runs
# with `set -x`, the diff prints object names only, and the only artifacts are
# bin/ (tools built from public and pinned sources), the render's digest and the
# suite's report (pass, fail or waiting per item, with checks' output that holds
# no secret).
#
# Deploy jobs run only on the dedicated deploy runner (tag `deploy`: VMs used
# once, max_use_count = 1), never on the agents' runner.

stages: [tools, checks, images, generate, diff, apply, test]

variables:
  GIT_STRATEGY: none
  GCP_PROJECT: jody1-328023
  GCP_DEPLOY_SA: seatrials-deploy@jody1-328023.iam.gserviceaccount.com
  # The tacplus-reader app's key, in Cloud KMS (.github-reader).
  TACPLUS_READER_KMS_KEY: projects/jody1-328023/locations/us/keyRings/looper/cryptoKeys/tacplus-reader
  # The service account the block signs as when KMS does not accept the job's
  # federated principal (#30; docs/deploy-pipeline.md, GitHub).
  TACPLUS_READER_SA: fleet-seatrials-reader@jody1-328023.iam.gserviceaccount.com
  # The commit being deployed: the parent pipeline writes it here (pipeline
  # variables are forbidden in the group).
  FLEET_COMMIT: ""

# This repository is private: every job that fetches it (fleet-plan, and each
# job of the child pipeline) reads it with a token of the keyless
# tacplus-reader GitHub App, minted for the job (#29; tacplus-dev/looper
# README, Credentials). The job's GitLab id_token (GCP_ID_TOKEN) is exchanged
# through Workload Identity Federation, as the job itself; Cloud KMS signs the
# app's JWT with the app's key, which never leaves KMS (if KMS refuses the
# federated principal, the job signs as the service account TACPLUS_READER_SA,
# which it may impersonate, #30; either refusal is logged with KMS's HTTP
# status and error, never a token); GitHub answers with a
# one-hour installation token, contents: read on this repository alone, which
# only the fetch's git sees. No GitHub credential is stored anywhere. The same
# block is in ci/gitlab-project.gitlab-ci.yml and ci/deploy.gitlab-ci.yml
# (ci/github_reader_test.sh checks both).
.github-reader: &github-reader |
  # github_reader_token: the app's installation token, on stdout.
  github_reader_token() (
    set -uo pipefail
    say() { echo "github_reader_token: $*" >&2; }
    die() { say "$@"; exit 1; }
    for v in $(compgen -e); do
      case "${!v}" in ghp_*|github_pat_*|gho_*|ghu_*|ghs_*|ghr_*)
        die "the job holds a stored GitHub token in $v: delete that variable, nothing reads one (docs/deploy-pipeline.md)" ;;
      esac
    done
    : "${GCP_ID_TOKEN:?the job has no id_tokens GCP_ID_TOKEN}"
    : "${GCP_WIF_PROVIDER:?the GitLab project variable GCP_WIF_PROVIDER is not set (docs/deploy-pipeline.md)}"
    : "${TACPLUS_READER_KMS_KEY:?TACPLUS_READER_KMS_KEY is not set}"
    : "${TACPLUS_READER_APP_ID:?the GitLab project variable TACPLUS_READER_APP_ID is not set (docs/deploy-pipeline.md)}"
    : "${TACPLUS_READER_INSTALLATION_ID:?the GitLab project variable TACPLUS_READER_INSTALLATION_ID is not set (docs/deploy-pipeline.md)}"
    t=$(mktemp -d) && trap 'rm -rf "$t"' EXIT || die "no temporary directory"
    export CLOUDSDK_CORE_DISABLE_PROMPTS=1
    b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
    # error FILE: the error in an answer, its status and message (a JSON
    # error, or the start of the answer as is), never a request.
    error() { jq -er '(.error // .) | select(.message) | [(.status | strings | select(test("^[A-Z_]+$"))), .message] | join(": ")' "$1" 2>/dev/null ||
      head -c 300 "$1" | tr '\n' ' '; }
    ( umask 077; printf '%s' "$GCP_ID_TOKEN" > "$t/oidc-token" ) || die "no temporary directory"
    now=$(date +%s)
    jwt=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url).$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' \
      "$((now - 60))" "$((now + 540))" "$TACPLUS_READER_APP_ID" | b64url)
    # kms_sign AS WHO [create-cred-config FLAG...]: Cloud KMS's signature of the
    # JWT's digest, in $t/jwt-sig, asked with a Google token for the job's
    # id_token, through WIF, as WHO. A refusal says KMS's HTTP status and
    # error; it returns 3 when KMS refused the caller (401, 403).
    kms_sign() {
      local as=$1 who=$2 token code=; shift 2
      export CLOUDSDK_CONFIG=$t/gcloud-$as
      gcloud iam workload-identity-pools create-cred-config "$GCP_WIF_PROVIDER" "$@" \
          --credential-source-file="$t/oidc-token" --output-file="$t/federation-$as.json" >/dev/null &&
        gcloud auth login --cred-file="$t/federation-$as.json" --quiet >/dev/null 2>"$t/gcloud-err" &&
        token=$(gcloud auth print-access-token 2>"$t/gcloud-err") ||
        { say "Workload Identity Federation refused this job ($GCP_WIF_PROVIDER) as $who: $(grep -m1 '^ERROR' "$t/gcloud-err" || head -c 300 "$t/gcloud-err")"; return 1; }
      ( umask 077; printf 'Authorization: Bearer %s\n' "$token" > "$t/kms-auth" ) || return 1
      code=$(curl -sS -o "$t/kms" -w '%{http_code}' -X POST -H @"$t/kms-auth" -H 'Content-Type: application/json' \
        -d "{\"digest\":{\"sha256\":\"$(printf '%s' "$jwt" | openssl dgst -sha256 -binary | openssl base64 -A)\"}}" \
        "https://cloudkms.googleapis.com/v1/$TACPLUS_READER_KMS_KEY/cryptoKeyVersions/1:asymmetricSign")
      rm -f "$t/kms-auth"
      [ "$code" = 200 ] && jq -er '.signature' "$t/kms" | openssl base64 -d -A > "$t/jwt-sig" && [ -s "$t/jwt-sig" ] && return 0
      say "Cloud KMS refused to sign with $TACPLUS_READER_KMS_KEY as $who: HTTP ${code:-none} $(error "$t/kms")"
      case $code in 401|403) return 3 ;; *) return 1 ;; esac
    }
    # As the job itself; if KMS does not accept the federated principal,
    # as the service account TACPLUS_READER_SA (#30, docs/deploy-pipeline.md).
    rc=0
    kms_sign direct "the job itself" || rc=$?
    if [ "$rc" = 3 ] && [ -n "${TACPLUS_READER_SA:-}" ]; then
      say "signing as the service account $TACPLUS_READER_SA instead"
      rc=0
      kms_sign sa "$TACPLUS_READER_SA" --service-account="$TACPLUS_READER_SA" || rc=$?
    fi
    [ "$rc" = 0 ] || die "no signature from Cloud KMS, so no token (docs/deploy-pipeline.md, GitHub)"
    ( umask 077; printf 'Authorization: Bearer %s.%s\n' "$jwt" "$(b64url < "$t/jwt-sig")" > "$t/github-auth" ) || die "no temporary directory"
    code=$(curl -sS -o "$t/answer" -w '%{http_code}' -X POST -H @"$t/github-auth" -H 'Accept: application/vnd.github+json' \
        -d '{"permissions":{"contents":"read"},"repositories":["fleet-seatrials"]}' \
        "https://api.github.com/app/installations/$TACPLUS_READER_INSTALLATION_ID/access_tokens")
    [[ $code == 2?? ]] && jq -er '.token // empty' "$t/answer" ||
      die "GitHub refused the tacplus-reader app a token for fleet-seatrials: HTTP ${code:-none} $(error "$t/answer")"
  )
  # github_fetch DIR REF: this repository at REF (main's head, or a full
  # commit hash) checked out in the new repository DIR.
  github_fetch() {
    local token
    token=$(github_reader_token) || return 1
    git init -q "$1" &&
      TACPLUS_READER_TOKEN=$token git -C "$1" -c credential.helper= \
        -c 'credential.https://github.com.helper=!f() { test "$1" = get && echo username=x-access-token && echo "password=$TACPLUS_READER_TOKEN"; }; f' \
        fetch -q --depth 1 https://github.com/tacplus-dev/fleet-seatrials.git "$2" &&
      git -C "$1" checkout -q FETCH_HEAD
  }

default:
  image: ghcr.io/tacplus-dev/tacplus/build:2.3
  tags: [deploy]
  interruptible: false
  # Every job: the reader token (.github-reader), and GCP (ci_gcp in ci/lib.sh).
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  before_script:
    # This repository at the commit being deployed, in src/ (where the tools
    # job's bin/ artifact lands).
    - *github-reader
    - |
      set -euo pipefail
      : "${FLEET_COMMIT:?no FLEET_COMMIT: this file runs as the child pipeline of ci/gitlab-project.gitlab-ci.yml}"
      github_fetch src "$FLEET_COMMIT"
      echo "fleet-seatrials at $(git -C src rev-parse --short=12 HEAD)"

tools:
  stage: tools
  needs: []
  script:
    - cd src && source ci/lib.sh && ci_github && ci/tools.sh
  artifacts:
    paths: [src/bin/]
    expire_in: 1 day

checks:
  stage: checks
  needs: [tools]
  script:
    - cd src && PATH=$PWD/bin:$PATH ci/checks.sh

images:
  stage: images
  needs: [checks]
  script:
    - cd src && source ci/lib.sh && ci_github && ci_gcp && WAIT=1 images/build.sh changed
  timeout: 2h

generate:
  stage: generate
  needs: [checks, tools]
  environment: { name: seatrials, action: prepare }
  script:
    - |
      cd src && source ci/lib.sh && ci_crypto
      export SCHEMATIC_OPERATOR_DIR=$PWD/deploy/bootstrap
      export SCHEMATIC_LOCAL_IMAGES=us-central1-docker.pkg.dev/jody1-328023/seabeam
      bin/schematic-operator generate
      deploy/checks.sh opa deploy/bootstrap/configs

diff:
  stage: diff
  needs: [tools, images, generate]
  environment: { name: seatrials, action: prepare }
  script:
    - |
      cd src && source ci/lib.sh && ci_crypto && ci_gcp && ci_kube
      RENDER_DIGEST_OUT=$CI_PROJECT_DIR/render.env deploy/diff.sh
  # RENDER_DIGEST, the digest of the render diff showed, for apply.
  artifacts:
    reports:
      dotenv: render.env

# The apply, by itself once diff succeeds: seatrials is not production, and
# only production waits for Jody (tacplus-dev/roadmap
# decisions/deterministic-deployments-2026-11-02.md, addendum; #34). In the
# protected environment seatrials. It applies the render diff showed, by its
# digest (RENDER_DIGEST, diff's dotenv), and the letsencrypt guard runs again
# first, on the cluster as it is now.
apply:
  stage: apply
  needs: [tools, diff]
  environment: { name: seatrials, action: start }
  resource_group: seatrials
  script:
    - |
      cd src && source ci/lib.sh && ci_crypto && ci_gcp && ci_kube
      deploy/diff.sh
      deploy/secrets.sh
      deploy/apply.sh
      deploy/signin-secrets.sh

# The apply when it touches letsencrypt, which is never restarted without
# Jody's explicit OK: its own protected environment, seatrials-letsencrypt,
# whose only deployer is Jody (docs/deploy-pipeline.md). Manual: playing it is
# that OK, not approval of the fleet. It applies the render its own diff, in
# this job's log, showed.
apply-letsencrypt:
  stage: apply
  needs: [tools, images, generate]
  environment: { name: seatrials-letsencrypt, action: start }
  resource_group: seatrials
  when: manual
  allow_failure: true
  variables:
    SEATRIALS_ALLOW_LETSENCRYPT: "1"
  script:
    - |
      cd src && source ci/lib.sh && ci_crypto && ci_gcp && ci_kube
      RENDER_DIGEST_OUT=$CI_PROJECT_DIR/render.env deploy/diff.sh
      export "$(cat "$CI_PROJECT_DIR/render.env")"
      deploy/secrets.sh
      deploy/apply.sh
      deploy/signin-secrets.sh

# Re-installs the sign-in secrets from the project variables, nothing else: a
# rotated secret (the Microsoft one every 6 months, #6) is a variable updated
# in the project and this job run.
signin-secrets:
  stage: apply
  needs: [tools]
  environment: { name: seatrials, action: start }
  resource_group: seatrials
  when: manual
  allow_failure: true
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci_kube && deploy/signin-secrets.sh

test:
  stage: test
  needs: [tools, apply]
  environment: { name: seatrials, action: verify }
  script:
    - |
      cd src && source ci/lib.sh && ci_crypto && ci_gcp && ci_kube
      export SCHEMATIC_OPERATOR_DIR=$PWD/deploy/bootstrap
      export SCHEMATIC_LOCAL_IMAGES=us-central1-docker.pkg.dev/jody1-328023/seabeam
      bin/schematic-operator generate >/dev/null
      E2E_CONFIGS=$PWD/deploy/bootstrap/configs E2E_JUNIT=$CI_PROJECT_DIR/e2e.xml deploy/e2e.sh
  # The functional suite's report (deploy/e2e.yaml), the evidence: GitLab's
  # test report, every item by name, a waiting one as skipped.
  artifacts:
    when: always
    reports:
      junit: e2e.xml

# The test IdP's jobs run as test-idp-deploy, which reaches the namespace
# test-idp of the tacplus cluster and the record idp.test.tacplus.dev only
# (test-idp/rbac.yaml, docs/deploy-pipeline.md), in the protected environment
# test-idp, whose variables are the test IdP's seeds.
.test-idp:
  resource_group: test-idp
  variables:
    GCP_DEPLOY_SA: test-idp-deploy@jody1-328023.iam.gserviceaccount.com
    CLUSTER: tacplus
    ZONE: us-central1-a

test-idp:
  extends: .test-idp
  stage: apply
  needs: [tools, checks]
  environment: { name: test-idp, action: start }
  when: manual
  allow_failure: true
  script:
    - cd src && source ci/lib.sh && ci_gcp && ci_kube && test-idp/apply.sh

test-idp-signin:
  extends: .test-idp
  stage: test
  needs: [tools, checks]
  environment: { name: test-idp, action: verify }
  # Until the test-idp job has set the test IdP up, a skip, not a failure (#31).
  script:
    - |
      cd src && source ci/lib.sh
      if ci_test_idp_set_up; then ci_gcp && ci_kube && test-idp/signin.sh; fi
