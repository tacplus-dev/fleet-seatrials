# The tacplus commit this fleet generates and builds with: v2.6.16, of fleet.yaml's
# floor 2.6 (#1, #3): the first patch whose sys/redo.proto makes redo a /system contract with no
# tenant route (tacplus#258), which redo 0.2 and stratum 0.2.5 are built on, and with kernel 0.2's
# JWT_PAYLOAD_TYPE_TID (kernel#32). ci/tools.sh and images/tacplus-build.cloudbuild.yaml stamp it
# with the same line. operator_commit is operator main at 5e8e316 (#3, tacplus-dev/operator#57): each
# tenant's Stratum in its own namespace (topology.stratum_members, tacplus-dev/operator#2) and redo as
# one /system instance in the platform namespace, on the tacplus 2.6.16 lock; it carries v0.2.1's coop
# pigeons_namespaces (tacplus-dev/operator#47, #83) and the three hub/v0.1.0-volume-minimum fixes
# (tacplus-dev/operator#53). No release of the operator has these yet.
tacplus_commit: 7319ce589915ef90a22feee80a13670f68a0d50b
operator_commit: 5e8e31645e08376e49796d94352a43c26bf698eb
launcher_commit: c575e147eeb1b5fc7f242a41578831f61bbcf708
# The image of the operator chart's extract-config init container, which unpacks
# the config bundle (deploy/apply.sh, #76): the chart says busybox:latest, and
# deploy/operator-post-render.sh puts this in its place, pinned by digest (an
# index: the operator runs on arm64).
operator_init_image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
# The platforms every service image is built for (images/build.sh): arm64, what
# the fleet runs on. amd64 is off to save the cost of a second build (Jody,
# 2026-10-29: tacplus-dev/roadmap decisions/deployments-per-cluster-2026-10-26.md,
# the addendum); [arm64, amd64] builds both again, one multi-arch image.
platforms: [arm64]
