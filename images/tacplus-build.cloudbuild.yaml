# Layers the fleet's tacplus binary onto tacplus's full build image. Source is
# the images/ directory (the Dockerfile and the launcher's source).
substitutions:
  _REGISTRY: us-central1-docker.pkg.dev/jody1-328023/seabeam
  _TACPLUS_COMMIT: unknown
  # The fingerprint of this image's inputs (images/build.sh fingerprint): the
  # service builds run in fp-<fingerprint>, so a change to this file, the
  # Dockerfile or a pinned commit gets a new image instead of a stale one.
  _FINGERPRINT: unknown
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --file=tacplus-build.Dockerfile
      - --build-arg=TACPLUS_IMAGE=${_REGISTRY}/ci/tacplus:${_TACPLUS_COMMIT}
      - --tag=${_REGISTRY}/ci/tacplus-build:fp-${_FINGERPRINT}
      - --tag=${_REGISTRY}/ci/tacplus-build:seatrials
      - .
images:
  - ${_REGISTRY}/ci/tacplus-build:fp-${_FINGERPRINT}
  - ${_REGISTRY}/ci/tacplus-build:seatrials
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
