# Builds the fleet's tacplus into tacplus's full build image. Source is the
# images/ directory (the Dockerfile and the tacplus and launcher sources).
substitutions:
  _REGISTRY: us-central1-docker.pkg.dev/tacplus-dev/seatrials
  # images/pins.yaml's tacplus_commit, the source in tacplus/ (images/build.sh).
  _TACPLUS_COMMIT: unknown
  # The fingerprint of this image's inputs (images/build.sh fingerprint): the
  # service builds run in fp-<fingerprint>, so a change to this file, the
  # Dockerfile or a pinned commit gets a new image instead of a stale one.
  _FINGERPRINT: unknown
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --file=tacplus-build.Dockerfile
      # The stamp ci/tools.sh gives bin/tacplus: the release tacplus_commit is.
      - --build-arg=TACPLUS_VERSION=v2.6.16-seatrials
      - --build-arg=TACPLUS_COMMIT=${_TACPLUS_COMMIT}
      - --tag=${_REGISTRY}/ci/tacplus-build:fp-${_FINGERPRINT}
      - --tag=${_REGISTRY}/ci/tacplus-build:seatrials
      - .
images:
  - ${_REGISTRY}/ci/tacplus-build:fp-${_FINGERPRINT}
  - ${_REGISTRY}/ci/tacplus-build:seatrials
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
