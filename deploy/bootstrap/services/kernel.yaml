key_rotation_interval_seconds: 604800
default_token_expiry_seconds: 3600
delegates:
    - name: eventbus
      authorized_services:
        - eventbus
        - kernel
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: eventbus
    - name: gateway
      authorized_services:
        - eventbus
        - gateway
        - kernel
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: gateway
    - name: oauth
      authorized_services:
        - kernel
        - oauth
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: oauth
      auth_broker_kinds:
        - idp
    - name: opa
      authorized_services:
        - kernel
        - opa
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: opa
    - name: operator
      authorized_services:
        - kernel
        - operator
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: schematic-operator
    - name: stratum
      authorized_services:
        - eventbus
        - kernel
        - stratum
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: stratum
    - name: doppelganger
      authorized_services:
        - doppelganger
        - kernel
        - llmproxy
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: doppelganger
    - name: tenantecho
      tenant_namespace: /tenants/alpha
      authorized_services:
        - coop
        - eventbus
        - kernel
        - tenantecho
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: tenantecho-alpha
    - name: tenantecho
      tenant_namespace: /tenants/beta
      authorized_services:
        - coop
        - eventbus
        - kernel
        - tenantecho
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: tenantecho-beta
    - name: llmproxy
      authorized_services:
        - kernel
        - llmproxy
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: llmproxy
      external_audiences:
        - https://api.anthropic.com
    - name: doppelganger
      tenant_namespace: /tenants/alpha
      authorized_services:
        - doppelganger
        - eventbus
        - kernel
        - llmproxy
        - stratum
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: doppelganger-alpha
    - name: doppelganger
      tenant_namespace: /tenants/beta
      authorized_services:
        - doppelganger
        - eventbus
        - kernel
        - llmproxy
        - stratum
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: doppelganger-beta
    - name: coop
      authorized_services:
        - coop
        - eventbus
        - kernel
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: coop
      # The coop mints each pigeon under the dog that asked for it, and
      # revokes it: the fleet's one workload broker.
      workload_broker: true
    - name: letsencrypt
      authorized_services:
        - eventbus
        - kernel
        - letsencrypt
        - stratum
      kubernetes_service_accounts:
        - kubernetes_namespace: schematic
          kubernetes_service_account: letsencrypt
