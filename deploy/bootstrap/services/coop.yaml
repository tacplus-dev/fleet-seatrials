# coop: the fleet's one door to pigeons, in MODE_JOBS: one Kubernetes Job per
# pigeon in the pigeons namespace the operator renders (<fleet>-pigeons), each
# with an identity kernel mints for the run. The one kind is echo.ping, done
# by the generic pigeon host (pigeonhost, github.com/tacplus-dev/pigeon): the result is
# the request. mock_result is what MODE_MOCK would answer with; it is kept so
# flipping the mode back is one line.
mode: MODE_JOBS
pigeons_namespace: schematic-pigeons
max_live_runs: 32
max_live_runs_per_tenant: 8
ready_timeout_ms: 60000
kinds:
    - name: echo.ping
      image: us-central1-docker.pkg.dev/jody1-328023/seabeam/schematic/pigeonhost:local
      cpu: 250m
      memory: 128Mi
      domain_ceiling: []
      max_deadline_ms: 600000
      max_budget_micros: 0
      mock_result:
          result:
              kind: echo.ping
              mode_used: RUN_MODE_SCRIPT
              status: RESULT_STATUS_OK
              result: cG9uZw== # "pong"
