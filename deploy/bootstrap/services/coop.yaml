# coop: the fleet's one door to pigeons. It runs each tenant's pigeons as Jobs in
# that tenant's namespace, tac-seatrials-<tid>, where the operator grants its
# pigeons Role: the operator renders those namespaces into the coop's
# pigeons_namespaces (coop 0.2, tacplus-dev/coop#17; tacplus-dev/operator#47),
# and refuses a coop.yaml naming a pigeons namespace of its own beside the
# deployment (#83; deploy/pigeons-namespaces_test.sh). The one kind is
# echo.ping; its mock_result is what coop answers with in MODE_MOCK.
mode: MODE_JOBS
max_live_runs: 32
max_live_runs_per_tenant: 8
ready_timeout_ms: 60000
kinds:
    - name: echo.ping
      image: us-central1-docker.pkg.dev/tacplus-dev/seatrials/schematic/pigeonhost:local
      cpu: 250m
      memory: 128Mi
      domain_ceiling: []
      max_deadline_ms: 600000
      max_budget_micros: 0
      mock_result:
          result:
              kind: echo.ping
              mode_used: RUN_MODE_SCRIPT
              status: RESULT_STATUS_OK
              result: cG9uZw== # "pong"
