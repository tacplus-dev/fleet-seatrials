# coop: the fleet's one door to pigeons, in MODE_MOCK until the fleet can run
# them as Jobs in its tenants' namespaces (#83: coop 0.2's pigeons_namespaces
# and tacplus-dev/operator#47, which the operator this fleet can pin does not
# have yet). In MODE_JOBS coop 0.1 lists the Jobs of the one pigeons_namespace
# at its start, and there is no such namespace in a deployment: the operator
# grants its pigeons Role in each tenant namespace, which one field cannot
# name (2026-11-27: "jobs.batch is forbidden … in the namespace
# schematic-pigeons", and coop never started). The one kind is echo.ping; its
# mock_result is what coop answers with.
mode: MODE_MOCK
max_live_runs: 32
max_live_runs_per_tenant: 8
ready_timeout_ms: 60000
kinds:
    - name: echo.ping
      image: us-central1-docker.pkg.dev/tacplus-dev/seatrials/schematic/pigeonhost:local
      cpu: 250m
      memory: 128Mi
      domain_ceiling: []
      max_deadline_ms: 600000
      max_budget_micros: 0
      mock_result:
          result:
              kind: echo.ping
              mode_used: RUN_MODE_SCRIPT
              status: RESULT_STATUS_OK
              result: cG9uZw== # "pong"
