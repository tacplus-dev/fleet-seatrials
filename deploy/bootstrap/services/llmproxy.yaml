# llmproxy reaches Anthropic with federated identity, no API key. The four
# federation ids below are the fleet's Anthropic workspace binding; Jody
# supplies them (they are not in any repo). Until they are set, model calls
# fail and doppelganger's answers surface that; everything up to the call still
# proves out.
anthropic_federation_rule_id: ""
anthropic_organization_id: ""
anthropic_service_account_id: ""
anthropic_workspace_id: ""
# The aliases this proxy serves. The provider model behind an alias is config:
# change it here and apply; callers keep asking for the alias. Prices are
# micro-USD per token (here $3 / $15 per million).
models:
    - alias: claude-sonnet
      provider_model: claude-sonnet-4-5
      input_micro_usd_per_token: 3
      output_micro_usd_per_token: 15
