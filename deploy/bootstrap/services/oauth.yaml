# OAuth service configuration.
# Unified auth broker: browser OAuth (OIDC) + CLI/device token delivery.
# Edit these, then run: schematic-operator generate
enable: true
scopes:
  - openid
  - profile
  - email
# Anyone with a Google, Microsoft or Apple account may sign in, and the test
# IdP's test users (below); whether they are entitled to anything is tenant
# membership, not the provider, so no provider lists domains. Client secrets are NOT here: Google's and
# Microsoft's ride the kernel-config-override ConfigMap (ConfigOverride path
# configs.oauth_config.providers, which replaces this whole list, so every
# provider must be in it — deploy/signin-secrets.sh keeps the two in step), and
# Apple's .p8 key rides the oauth-pipeline-secrets Secret. Git holds neither.
providers:
  - enable: true
    name: Google
    issuer: https://accounts.google.com
    # OAuth client "seatrials-web" in GCP project jody1-328023 (2026-10-24),
    # redirect URI https://seatrials.tacplus.dev/
    client_id: 23279701427-3nm40dmid06nd3niqufrq88sbl90p0n3.apps.googleusercontent.com
    allowed_redirect_uri_prefixes:
      - https://seatrials.tacplus.dev/
    scopes:
      - openid
      - profile
      - email

  # App registration "seatrials-web" in Entra, directory jodyseabeam.onmicrosoft.com
  # (jody@seabeam.net, 2026-10-26): any Entra directory plus personal accounts,
  # redirect URI https://seatrials.tacplus.dev/, optional ID-token claims email
  # and xms_edov. issuer is the common endpoint (discovery, JWKS); a token's own
  # iss names its directory, checked against issuer_template.
  - enable: true
    name: Microsoft
    issuer: https://login.microsoftonline.com/common/v2.0
    issuer_template: https://login.microsoftonline.com/{tid}/v2.0
    email_verified_claim: xms_edov
    client_id: deee63f8-1d3b-46c8-aa3a-f7b2d7eb3f85
    allowed_redirect_uri_prefixes:
      - https://seatrials.tacplus.dev/
    scopes:
      - openid
      - profile
      - email
  # Sign in with Apple, Apple Developer team DQQPWV62P5 (2026-10-26): Services ID
  # dev.tacplus.seatrials.web on primary App ID dev.tacplus.seatrials, domain
  # seatrials.tacplus.dev, return URL the gateway's form-post callback. No client
  # secret: oauth mints one per request from the .p8 key (key D9JNT33239), which
  # rides the oauth-pipeline-secrets Secret, never git.
  - enable: true
    name: Apple
    issuer: https://appleid.apple.com
    client_id: dev.tacplus.seatrials.web
    allowed_redirect_uri_prefixes:
      - https://seatrials.tacplus.dev/
    scopes:
      - name
      - email
    apple:
      team_id: DQQPWV62P5
      key_id: D9JNT33239
      form_post_redirect_uri: https://seatrials.tacplus.dev/oauth/Auth/BrokerFormPostCallback

  # The test IdP (#27, test-idp/README.md): one Keycloak at idp.test.tacplus.dev
  # whose realms emulate the claim shapes of Google, Microsoft and Apple, with
  # test users only, so sign-in is tested with no person. Plain OIDC, each
  # with the client tacplus-dev; the client secrets are derived from the test
  # IdP's seed by deploy/signin-secrets.sh, which turns a provider off while
  # its realm does not answer.
  - enable: true
    name: Test Google
    issuer: https://idp.test.tacplus.dev:8443/realms/google
    client_id: tacplus-dev
    allowed_redirect_uri_prefixes:
      - https://seatrials.tacplus.dev/
    scopes:
      - openid
      - profile
      - email
  # As Microsoft above, xms_edov decides whether email reaches policy; the
  # realm's issuer is one URL for every directory (no issuer_template).
  - enable: true
    name: Test Microsoft
    issuer: https://idp.test.tacplus.dev:8443/realms/microsoft
    email_verified_claim: xms_edov
    client_id: tacplus-dev
    allowed_redirect_uri_prefixes:
      - https://seatrials.tacplus.dev/
    scopes:
      - openid
      - profile
      - email
  - enable: true
    name: Test Apple
    issuer: https://idp.test.tacplus.dev:8443/realms/apple
    client_id: tacplus-dev
    allowed_redirect_uri_prefixes:
      - https://seatrials.tacplus.dev/
    scopes:
      - openid
      - name
      - email
