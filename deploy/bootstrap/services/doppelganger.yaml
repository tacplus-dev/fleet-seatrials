# doppelganger: one instance per tenant. Context lives under repo_dir and is
# uploaded through the service (seatrials context push: the tenant's shared
# context with a tenant-admin pair, a user's own with their pair); nothing is
# mounted or synced in. On disk until stratum is ported.
repo_dir: /var/lib/doppelganger/repo
state_dir: /var/lib/doppelganger/sessions
model_alias: claude-sonnet # the one alias llmproxy serves today (anthropic.rs resolve_model_alias)
