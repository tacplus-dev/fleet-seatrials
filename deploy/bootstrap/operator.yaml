# The sea-trials deployment: one of everything, two tenants, the two proofs as
# app services. The public name is under tacplus.dev (an A record at the
# registrar pointing at the reserved gateway IP) and its certificate is Let's
# Encrypt's, so the fleet is a real OIDC issuer: Anthropic's federation fetches
# its discovery document over public TLS. The pipeline owns that certificate
# (#35, ci/cert.sh): it is installed as crypto.yaml's pki.edge_tls[0] in the
# job, and the gateway serves it in CERT_CHAIN mode, so there is no `tls:` here
# and no letsencrypt workload. The operator CA (crypto.yaml) still signs the
# cluster's internal PKI.
dev: true
fqdn: seatrials.tacplus.dev
external_ip: 146.148.80.132
port: 443
optional_services:
    oauth: true
tenants:
    - alpha
    - beta
topology:
    kernel_nodes: 1
    eventbus_nodes: 1
    gateway_nodes: 1
    kmaker_nodes: 1
    oauth_nodes: 1
    opa_nodes: 1
    stratum_nodes: 3 # the durability floor: a node restoring from peers needs two durable copies besides itself
    app_services:
        # llmproxy is an app service to the operator (the library knows the
        # kernel-side platform set; everything else is named here).
        llmproxy: 1
        doppelganger: 1
        tenantecho: 1
        coop: 1
# The root credential pair the local client (client/) authenticates with; its
# private key is in ~/.seatrials/root.cred.json on the operator's machine.
root_cred_pairs:
    - {"description": "seatrials client root", "entitlements": {"grants": ["KERNEL_ANY"]}, "id": "root-feb39e0fd6b526ff", "namespaces": ["*"], "public_key": {"alg": "ES256", "created": "1792824696", "crv": "P-256", "kid": "root-feb39e0fd6b526ff", "kty": "KEY_TYPE_EC", "use": "JWK_USE_TYPE_SIG", "x": "AG-Dtk99_lhExP89vIdGaUwXNx6ghYrusTd67hk5Oq0", "y": "F2HNuBJUIzMSNZZkkhI8hVl3byJMb3r3qpShFDF_-SU"}, "tenant_name": "/"}
