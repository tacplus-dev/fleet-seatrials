# beta's OAuth slice (oauth.OAuthTenantConfig). A Microsoft sign-in from the
# jodyseabeam.onmicrosoft.com directory (where jody@seabeam.net lives) is an
# org proof for /tenants/beta; any other sign-in is a personal proof. The
# operator renders this into the OPA routing policy (tenants/namespace.rego).
claim_matchers:
  - provider_issuer_url: https://login.microsoftonline.com/common/v2.0
    claim_key: tid
    claim_value: ec3604c3-01c7-4537-aa2b-c39874000664
