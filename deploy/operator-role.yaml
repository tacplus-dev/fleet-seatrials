# The operator's rights in the platform namespace (#76), which deploy/operator-post-render.sh adds to the
# operator's release, ${NAMESPACE} its namespace. With `deployment` set the operator's chart renders no Role
# (operator helm/values.yaml: the cluster pipeline grants them), and tacplus-dev/cluster binds the operator's
# account there only to deploymentproxy's Role (TenantNamespaces). In the tenant namespaces deploymentproxy binds
# it admin. These rules are the chart's own Role (operator helm/templates/role.yaml at images/pins.yaml's
# operator_commit), each within the deploy account's fleet-deploy Role (tacplus-dev/cluster render.sh), which
# Kubernetes' escalation check requires of a Role it creates: nothing outside tac-seatrials, nothing
# cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: schematic-operator
  namespace: ${NAMESPACE}
rules:
  # The objects of the fleet's chart, and helm's release state (Secrets).
  - apiGroups: [""]
    resources: [services, serviceaccounts, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # The chart's own Roles (<service>-pigeons and the like).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # A pod stuck on an old StatefulSet revision is deleted (operator defect #15).
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # Leader election.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: schematic-operator
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: schematic-operator
subjects:
  # The chart's ServiceAccount of a deployment, the name deploymentproxy binds too.
  - kind: ServiceAccount
    name: operator
    namespace: ${NAMESPACE}
