# The secrets scan (#22): gitleaks over the full history and the tree at HEAD
# (ci/secrets.sh). The deploy pipeline's checks stage runs it too (ci/checks.sh).
name: secrets
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL --retry 5 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - run: ci/secrets.sh
      - run: ci/secrets_test.sh
