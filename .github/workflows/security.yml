# The security job (#36, ci/security.sh) on every push to main, every pull
# request and nightly: the deploy pipeline in GitLab runs it before it builds or
# applies anything, and this runs it where the pushes and pull requests are.
# The same tools (ci/tools.sh), in the same CI image; the JSON report is the
# run's artifact. The job runs on the runner's host, not in the image
# (`container:`): the image alone takes most of the runner's free disk, and the
# builds ran out of it (#37). So it frees the runner's preinstalled toolsets
# first, then runs each script in the image. ci/workflows_test.sh checks this.
name: security
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/tacplus-dev/tacplus/build:2.3
    steps:
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/w" -w /w "$IMAGE" bash -c 'git config --global --add safe.directory /w && ci/tools.sh'
      - run: docker run --rm -v "$PWD:/w" -w /w "$IMAGE" bash -c 'git config --global --add safe.directory /w && PATH=/w/bin:$PATH ci/security.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security/
          retention-days: 30
