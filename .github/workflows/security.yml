# The security job (#36, ci/security.sh) on every push to main, every pull
# request and nightly: the deploy pipeline in GitLab runs it before it builds or
# applies anything, and this runs it where the pushes and pull requests are.
# The same tools (ci/tools.sh), in the same CI image; the JSON report is the
# run's artifact.
name: security
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: ghcr.io/tacplus-dev/tacplus/build:2.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ci/tools.sh
      - run: PATH=$PWD/bin:$PATH ci/security.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security/
          retention-days: 30
