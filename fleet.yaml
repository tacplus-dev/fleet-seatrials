# Sea trials: the proof fleet. It exists to show one thing — doppelganger runs
# as an ordinary tacplus service on a fleet built from the registry, reached
# through the gateway, answering through llmproxy — on a small cluster that is
# created and destroyed as needed (Jody, 2026-10-23). Everything here is the
# smallest set the fleet build's closure allows; a service is listed only
# because something in the fleet needs it.
#
# The second proof: tenantecho, a trivial tenant-owned service deployed into two
# tenant namespaces, to show the gateway routes each tenant's call to that
# tenant's instance.
registries:
  - https://github.com/tacplus-dev/registry.git
tacplus: "2.6"
services:
  - name: kernel
    version: "0.1"
    repo: https://github.com/tacplus-dev/kernel.git
  - name: opa
    version: "0.1"
    repo: https://github.com/tacplus-dev/opa.git
  - name: gateway
    version: "0.1"
    repo: https://github.com/tacplus-dev/gateway.git
  - name: eventbus
    version: "0.1"
    repo: https://github.com/tacplus-dev/eventbus.git
  - name: stratum
    version: "0.1"
    repo: https://github.com/tacplus-dev/stratum.git
  # oauth: users log in through it to get the token the gateway checks; kernel's
  # people/tenant code and the gateway reference its contract directly.
  - name: oauth
    version: "0.1"
    repo: https://github.com/tacplus-dev/oauth.git
  # kmaker: the operator always renders the key maker (kernel's signing CA path).
  - name: kmaker
    version: "0.1"
    repo: https://github.com/tacplus-dev/kmaker.git
  - name: llmproxy
    version: "0.1"
    repo: https://github.com/tacplus-dev/llmproxy.git
  - name: doppelganger
    version: "0.1"
    repo: https://github.com/tacplus-dev/doppelganger.git
  - name: tenantecho
    version: "0.1"
    repo: https://github.com/tacplus-dev/tenantecho.git
  # coop: the pigeon protocol and the one door to pigeons; in MODE_MOCK here so
  # the fleet proves a dog's round trip on the thread before Jobs exist.
  - name: coop
    version: "0.1"
    repo: https://github.com/tacplus-dev/coop.git
  # pigeonhost: the generic pigeon host. Never a Deployment: the coop runs it
  # as a Job per pigeon; it is in the fleet for its contract and its image.
  - name: pigeonhost
    version: "0.1"
    repo: https://github.com/tacplus-dev/pigeon.git
  # redo: the durability of every tenant's Stratum (stratum 0.1 appends to it),
  # in the reserved restore tenant; the operator renders its Config (#3).
  - name: redo
    version: "0.1"
    repo: https://github.com/tacplus-dev/redo.git
